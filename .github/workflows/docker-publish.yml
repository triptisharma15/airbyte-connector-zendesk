# Builds the connector image and pushes to GitHub Container Registry (GHCR).
# Use this image URL in Airbyte (self-hosted): registry + tag below.

name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/airbyte-connector-zendesk:latest
            ghcr.io/${{ github.repository_owner }}/airbyte-connector-zendesk:${{ github.sha }}
