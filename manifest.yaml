version: 2.0.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - tags

api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 10
          interval: PT1M
      matchers:
        - url_path_pattern: "^/api/v2/incremental/.*"
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: 100
          interval: PT1M
      matchers:
        - url_path_pattern: "^/api/v2/search/export$"

definitions:
  basic_authenticator:
    type: BasicHttpAuthenticator
    username: "{{ config['credentials']['email'] + '/token' }}"
    password: "{{ config['credentials']['api_token'] }}"

  retriever:
    type: SimpleRetriever
    requester:
      type: HttpRequester
      url_base: "https://{{ config['subdomain'] }}.zendesk.com/api/v2/"
      http_method: GET
      authenticator:
        $ref: "#/definitions/basic_authenticator"
      error_handler:
        type: DefaultErrorHandler
        response_filters:
          - http_codes: [403, 404]
            action: FAIL
            failure_type: config_error
            error_message: >-
              Unable to read stream {{ parameters.get('name') }}. Check permissions or disable the stream. {{ response.get('error') }}
        backoff_strategies:
          - type: WaitTimeFromHeader
            header: Retry-After
    record_selector:
      type: RecordSelector
      extractor:
        type: DpathExtractor
        field_path:
          - "{{ parameters.get('data_path') or parameters.get('name') }}"
      schema_normalization: Default
    paginator:
      type: DefaultPaginator
      page_size_option:
        type: RequestOption
        field_name: per_page
        inject_into: request_parameter
      pagination_strategy:
        type: CursorPagination
        page_size: 100
        cursor_value: '{{ response.get("next_page", {}) }}'
        stop_condition: "{{ last_page_size == 0 }}"
      page_token_option:
        type: RequestPath

  base_stream:
    type: DeclarativeStream
    retriever:
      $ref: "#/definitions/retriever"

  cursor_incremental_sync:
    type: DatetimeBasedCursor
    cursor_datetime_formats:
      - "%s"
      - "%Y-%m-%dT%H:%M:%SZ"
      - "%Y-%m-%dT%H:%M:%S%z"
    datetime_format: "%s"
    cursor_field: "{{ parameters.get('cursor_field', 'updated_at') }}"
    start_datetime:
      datetime: "{{ timestamp(config.get('start_date')) | int if config.get('start_date') else day_delta(-730, '%s') }}"
    start_time_option:
      inject_into: request_parameter
      field_name: "{{ parameters['cursor_filter'] }}"
      type: RequestOption

  base_incremental_stream:
    $ref: "#/definitions/base_stream"
    incremental_sync:
      $ref: "#/definitions/cursor_incremental_sync"

  links_next_paginator:
    type: DefaultPaginator
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response['links']['next'] }}"
      stop_condition: "{{ not response['meta']['has_more'] }}"
      page_size: 100
    page_token_option:
      type: RequestPath
    page_size_option:
      type: RequestOption
      field_name: "page[size]"
      inject_into: request_parameter

  after_url_paginator:
    type: DefaultPaginator
    pagination_strategy:
      type: CursorPagination
      cursor_value: '{{ response.get("after_url") }}'
      stop_condition: '{{ response.get("end_of_stream") }}'
      page_size: 100
    page_token_option:
      type: RequestPath

  end_of_stream_paginator:
    type: DefaultPaginator
    pagination_strategy:
      type: CursorPagination
      cursor_value: '{{ response.get("next_page", {}) }}'
      stop_condition: '{{ response.get("end_of_stream") }}'
      page_size: 100
    page_token_option:
      type: RequestPath

  export_search_paginator:
    type: DefaultPaginator
    pagination_strategy:
      type: CursorPagination
      cursor_value: "{{ response.get('links', {}).get('next', '') }}"
      stop_condition: "{{ not response.get('meta', {}).get('has_more', False) }}"
      page_size: 100
    page_token_option:
      type: RequestPath
    page_size_option:
      type: RequestOption
      field_name: "page[size]"
      inject_into: request_parameter

  tags_stream:
    $ref: "#/definitions/base_stream"
    retriever:
      $ref: "#/definitions/retriever"
      paginator:
        $ref: "#/definitions/links_next_paginator"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/tags"
    $parameters:
      name: tags
      path: tags
      primary_key: name

  organizations_stream:
    $ref: "#/definitions/base_incremental_stream"
    retriever:
      $ref: "#/definitions/retriever"
      ignore_stream_slicer_parameters_on_paginated_requests: true
      paginator:
        $ref: "#/definitions/end_of_stream_paginator"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/organizations"
    $parameters:
      name: organizations
      path: incremental/organizations
      cursor_field: updated_at
      cursor_filter: start_time
      primary_key: id

  users_stream:
    $ref: "#/definitions/base_incremental_stream"
    retriever:
      $ref: "#/definitions/retriever"
      ignore_stream_slicer_parameters_on_paginated_requests: true
      paginator:
        $ref: "#/definitions/after_url_paginator"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/users"
    $parameters:
      name: users
      path: incremental/users/cursor.json
      cursor_field: updated_at
      cursor_filter: start_time
      primary_key: id

  tickets_stream:
    type: DeclarativeStream
    name: tickets
    primary_key: id
    retriever:
      $ref: "#/definitions/retriever"
      ignore_stream_slicer_parameters_on_paginated_requests: true
      requester:
        $ref: "#/definitions/retriever/requester"
        path: search/export
        request_parameters:
          query: "created>={{ format_datetime(stream_interval['start_time']|int, '%Y-%m-%dT%H:%M:%SZ', '%s') }} created<={{ format_datetime(stream_interval['end_time']|int, '%Y-%m-%dT%H:%M:%SZ', '%s') }}"
          "filter[type]": ticket
      paginator:
        $ref: "#/definitions/export_search_paginator"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
        schema_normalization: Default
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_datetime_formats:
        - "%s"
        - "%Y-%m-%dT%H:%M:%SZ"
        - "%Y-%m-%dT%H:%M:%S%z"
      datetime_format: "%s"
      cursor_field: created_at
      start_datetime:
        datetime: "{{ timestamp(config.get('start_date')) | int if config.get('start_date') else day_delta(-730, '%s') }}"
      end_datetime:
        datetime: "{{ now_utc().strftime('%s') }}"
      step: P30D
      cursor_granularity: PT1S
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/tickets"

  ticket_comments_stream:
    $ref: "#/definitions/base_incremental_stream"
    retriever:
      $ref: "#/definitions/retriever"
      ignore_stream_slicer_parameters_on_paginated_requests: true
      requester:
        $ref: "#/definitions/retriever/requester"
        request_parameters:
          include: comment_events
      record_selector:
        type: RecordSelector
        extractor:
          type: CustomRecordExtractor
          class_name: source_declarative_manifest.components.ZendeskTicketCommentEventsExtractor
          field_path:
            - ticket_events
            - "*"
            - child_events
            - "*"
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: CursorPagination
          cursor_value: '{{ response.get("next_page", {}) }}'
          stop_condition: '{{ response.get("end_of_stream") }}'
          page_size: "{{ config.get('page_size', 100) }}"
        page_token_option:
          type: RequestPath
        page_size_option:
          type: RequestOption
          field_name: per_page
          inject_into: request_parameter
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/ticket_comments"
    $parameters:
      name: ticket_comments
      path: incremental/ticket_events.json
      cursor_field: created_at
      cursor_filter: start_time
      primary_key: id

schemas:
  tags:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      name:
        type: string
  organizations:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      id:
        type: integer
      updated_at:
        type: string
  users:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      id:
        type: integer
      updated_at:
        type: string
  tickets:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      id:
        type: integer
      created_at:
        type: string
  ticket_comments:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    additionalProperties: true
    properties:
      id:
        type: integer
      ticket_id:
        type: integer
      created_at:
        type: string

concurrency_level:
  type: ConcurrencyLevel
  default_concurrency: "{{ config.get('num_workers', 3) }}"
  max_concurrency: 40

spec:
  type: Spec
  documentationUrl: https://developer.zendesk.com/api-reference/ticketing/introduction/
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    title: Zendesk Support (custom) source
    type: object
    required:
      - subdomain
      - credentials
    additionalProperties: true
    properties:
      subdomain:
        type: string
        title: Subdomain
        description: >-
          Zendesk subdomain slug only (e.g. mycompany from https://mycompany.zendesk.com).
        order: 0
      credentials:
        type: object
        title: Authentication
        order: 1
        required:
          - email
          - api_token
        properties:
          email:
            type: string
            title: Email
            description: Zendesk agent email used to create the API token.
          api_token:
            type: string
            title: API Token
            description: Zendesk API token (Admin Center or legacy token page).
            airbyte_secret: true
      start_date:
        type: string
        title: Start Date
        description: >-
          UTC lower bound for incremental streams (YYYY-MM-DDTHH:mm:ssZ). If empty, defaults to ~730 days ago.
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        pattern_descriptor: YYYY-MM-DDTHH:mm:ssZ
        format: date-time
        order: 2
      num_workers:
        type: integer
        title: Number of concurrent workers
        description: Declarative engine concurrency hint (default 3).
        default: 3
        minimum: 1
        maximum: 40
        order: 3
      page_size:
        type: integer
        title: Page size (ticket_comments)
        description: per_page for incremental ticket_events (default 100).
        default: 100
        minimum: 1
        maximum: 100
        order: 4

streams:
  - $ref: "#/definitions/tags_stream"
  - $ref: "#/definitions/organizations_stream"
  - $ref: "#/definitions/users_stream"
  - $ref: "#/definitions/tickets_stream"
  - $ref: "#/definitions/ticket_comments_stream"
